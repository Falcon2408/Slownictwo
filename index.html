<!DOCTYPE html>
<html lang="pl" data-theme="boy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>BritVocab Pro — Inteligentna Nauka Angielskiego</title>
  <link rel="manifest" href='data:application/manifest+json,{"name":"BritVocab Pro","short_name":"BritVocab","start_url":".","display":"standalone","background_color":"#f1f5f9","theme_color":"#1e3a8a"}' />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Aptos', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    }

    :root[data-theme="boy"] {
      --bg-base: #eef2f9;
      --bg-surface: rgba(255, 255, 255, 0.94);
      --bg-surface-alt: #f8fafc;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --accent-primary: #1d4ed8;
      --accent-hover: #1e40af;
      --accent-soft: #dbeafe;
      --accent-border: #93c5fd;
      --btn-face: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      --btn-shadow: #1e3a8a;
      --btn-secondary-face: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
      --btn-secondary-shadow: #94a3b8;
      --uk-stroke: #1e3a8a;
      --badge-tech-bg: #0f172a;
      --badge-tech-text: #38bdf8;
    }

    :root[data-theme="girl"] {
      --bg-base: #fdf2f8;
      --bg-surface: rgba(255, 255, 255, 0.94);
      --bg-surface-alt: #fff5f9;
      --text-primary: #3b0764;
      --text-secondary: #701a75;
      --accent-primary: #be185d;
      --accent-hover: #9d174d;
      --accent-soft: #fce7f3;
      --accent-border: #f9a8d4;
      --btn-face: linear-gradient(180deg, #ec4899 0%, #be185d 100%);
      --btn-shadow: #831843;
      --btn-secondary-face: linear-gradient(180deg, #ffffff 0%, #fce7f3 100%);
      --btn-secondary-shadow: #d8b4fe;
      --uk-stroke: #86198f;
      --badge-tech-bg: #4c1d95;
      --badge-tech-text: #f5d0fe;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      transition: background-color 0.35s ease, color 0.35s ease;
      position: relative;
      overflow-x: hidden;
      padding-bottom: 40px;
    }

    .uk-skyline-bg {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 44vh;
      max-height: 420px;
      z-index: 0;
      pointer-events: none;
      opacity: 0.08;
    }

    .uk-skyline-bg svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      stroke: var(--uk-stroke);
      fill: none;
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 18px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: var(--bg-surface);
      backdrop-filter: blur(10px);
      padding: 16px 24px;
      border-radius: 20px;
      border: 1px solid var(--accent-border);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06);
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-flag {
      width: 38px;
      height: 26px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand span {
      font-size: 0.82rem;
      color: var(--text-secondary);
      display: block;
    }

    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-3d {
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      color: #ffffff;
      background: var(--btn-face);
      box-shadow: 0 4px 0 var(--btn-shadow), 0 6px 12px rgba(0, 0, 0, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      user-select: none;
    }

    .btn-3d:hover { filter: brightness(1.06); }
    .btn-3d:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--btn-shadow), 0 2px 5px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .btn-quiz {
      border: none;
      border-radius: 999px !important;
      padding: 14px 24px !important;
      font-size: 1rem !important;
      font-weight: 800 !important;
      cursor: pointer;
      color: #ffffff;
      background: var(--btn-face);
      box-shadow: 0 5px 0 var(--btn-shadow), 0 8px 16px rgba(0, 0, 0, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex: 1;
      min-width: 170px;
      user-select: none;
    }

    .btn-quiz:hover { filter: brightness(1.06); }
    .btn-quiz:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--btn-shadow), 0 3px 6px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .btn-quiz.success {
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      box-shadow: 0 5px 0 #065f46, 0 8px 16px rgba(0,0,0,0.16), inset 0 1px 0 rgba(255,255,255,0.4);
    }
    .btn-quiz.success:active { box-shadow: 0 2px 0 #065f46; }

    .btn-quiz.warning {
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
      box-shadow: 0 5px 0 #92400e, 0 8px 16px rgba(0,0,0,0.16), inset 0 1px 0 rgba(255,255,255,0.4);
    }
    .btn-quiz.warning:active { box-shadow: 0 2px 0 #92400e; }

    .btn-3d.secondary {
      color: var(--text-primary);
      background: var(--btn-secondary-face);
      border: 1px solid var(--accent-border);
      box-shadow: 0 4px 0 var(--btn-secondary-shadow), 0 5px 10px rgba(0, 0, 0, 0.06), inset 0 1px 0 #ffffff;
    }
    .btn-3d.secondary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--btn-secondary-shadow), inset 0 1px 0 #ffffff; }
    .btn-3d.secondary.active-tab { background: var(--accent-soft); border-color: var(--accent-primary); color: var(--accent-primary); }

    .card {
      background: var(--bg-surface);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 24px;
      border: 1px solid var(--accent-border);
      box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.07);
      margin-bottom: 22px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
    }

    .stat-box {
      background: var(--bg-surface-alt);
      border: 1px solid var(--accent-border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--accent-primary);
      line-height: 1.1;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 4px;
      font-weight: 600;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    input[type="text"], select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid var(--accent-border);
      background: #ffffff;
      color: #0f172a;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .milestone-bar {
      background: var(--bg-surface-alt);
      border: 1px solid var(--accent-border);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 20px;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      background: rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      background: var(--btn-face);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .word-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 440px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .word-item {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--bg-surface-alt);
      border: 1px solid var(--accent-border);
      border-radius: 14px;
      padding: 12px 16px;
    }

    .word-en { font-size: 1.08rem; font-weight: 800; color: var(--text-primary); }
    .word-pl { font-size: 0.95rem; color: var(--text-secondary); }
    .word-context { font-size: 0.78rem; color: var(--accent-primary); font-weight: 700; margin-top: 2px; }

    .word-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--accent-soft);
      color: var(--accent-primary);
    }
    .badge.tech { background: var(--badge-tech-bg); color: var(--badge-tech-text); }

    .mastery-pill {
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      background: #e2e8f0;
      color: #1e293b;
    }

    .quiz-box {
      text-align: center;
      padding: 10px 4px;
    }

    .quiz-prompt-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      font-weight: 700;
    }

    .quiz-word {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 10px 0 16px 0;
      color: var(--accent-primary);
    }

    .quiz-controls {
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .quiz-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 6px;
    }

    .mic-pulse {
      animation: pulse 1.2s infinite;
      background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%) !important;
      box-shadow: 0 5px 0 #7f1d1d !important;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .feedback-banner {
      margin-top: 14px;
      padding: 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      display: none;
    }
    .feedback-banner.ok { display: block; background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .feedback-banner.err { display: block; background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }

    .modal-card {
      background: #ffffff;
      color: #0f172a;
      max-width: 480px;
      width: 100%;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      border: 2px solid var(--accent-primary);
    }

    .context-option {
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      margin-top: 10px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .context-option:hover { background: var(--accent-soft); border-color: var(--accent-primary); }
    .hidden { display: none !important; }
  </style>
</head>
